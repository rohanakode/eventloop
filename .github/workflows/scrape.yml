name: Scrape events

# Runs the ingestion pipeline (fetch -> filter -> dedup -> store, and expire
# past events). This is the same job the maintainer runs locally with
# `python -m app.pipeline.ingest` -- it reads whatever sources are listed in
# app/sources/registry.py, so adding a new source needs NO change here.

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST, every day. The :30 minute is off-peak, which
    # reduces how long GitHub queues the run (scheduled jobs can be delayed).
    - cron: "30 0 * * *"
  workflow_dispatch: {} # adds a manual "Run workflow" button in the Actions tab

# If a run is already in progress (e.g. a manual run overlapping the schedule),
# let it finish and skip the new one rather than scraping twice at once.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion
        env:
          # Add these in: repo Settings -> Secrets and variables -> Actions.
          # Never commit real values -- these read from GitHub Secrets.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # IMPORTANT: this MUST be the same Jina key production uses, so new
          # events are embedded at the same 1024-dim size as the existing
          # Atlas vector index. Without it, embeddings fall back to a local
          # 384-dim model and won't match the index.
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # Only needed if your DB name isn't the default "eventloop":
          # MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: python -m app.pipeline.ingest
